{{- if .Values.gatewayApi.enabled }}
{{- range $name, $app := .Values.apps }}
{{- if ($app.enabled | default true) }}
{{- $ctx := dict "root" $ "name" $name "app" $app }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "bonnal-cloud.appFullname" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "bonnal-cloud.appLabels" $ctx | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gatewayApi.existingGateway.name | default (include "bonnal-cloud.fullname" $) }}
      {{- if $.Values.gatewayApi.existingGateway.namespace }}
      namespace: {{ $.Values.gatewayApi.existingGateway.namespace }}
      {{- end }}
      {{- if not $.Values.gatewayApi.existingGateway.name }}
      sectionName: {{ printf "%s-%s" $.Values.gatewayApi.listenerNamePrefix $name }}
      {{- end }}
  hostnames:
    - {{ $app.host }}
  rules:
    - backendRefs:
        - name: {{ include "bonnal-cloud.appFullname" $ctx }}
          port: {{ $.Values.service.port }}
{{- end }}
{{- end }}
{{- end }}
